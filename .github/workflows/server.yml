name: Server Run
on:
  workflow_dispatch:
    inputs:
      should_add_op:
        type: boolean
        default: false
        description: Whether to apply the value of op_name input.
        required: true
      op_name:
        type: string
        required: false
        description: The Minecraft username of a player to make an operator.
concurrency:
  group: server-run
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: clone repo locally
      - name: import Node
        uses: actions/setup-node@v3
        with:
          node-version: 16
      - name: setup jdk 17
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: "microsoft"
      - name: Install remote.it
        run: R3_REGISTRATION_CODE="${{ secrets.REMOTEIT_CODE }}" sh -c "$(curl -L https://downloads.remote.it/remoteit/install_agent.sh)"
      - name: Run Server (Long)
        id: run_server
        run: |
          curl -L "https://meta.fabricmc.net/v2/versions/loader/1.20.6/stable/stable/server/jar" --output fabric-server-launch.jar
          echo "eula=true" > eula.txt
          
          if [ "${{ inputs.should_add_op }}" = "true" ]; then
            PLAYER_NAME="${{ inputs.op_name }}"
            PLAYER_UUID=$(curl -s "https://mojang.com{PLAYER_NAME}" | jq -r .id)
            FORMATTED_UUID=$(echo $PLAYER_UUID | sed -E "s/([0-9a-f]{8})([0-9a-f]{4})([0-9a-f]{4})([0-9a-f]{4})([0-9a-f]{12})/\1-\2-\3-\4-\5/")
            
            if [ ! -z "$PLAYER_UUID" ] && [ "$PLAYER_UUID" != "null" ]; then
              echo "[{\"uuid\":\"${FORMATTED_UUID}\",\"name\":\"${PLAYER_NAME}\",\"level\":4,\"bypassesPlayerLimit\":false}]" > ops.json
              echo "成功設定 $dyyub 為管理員"
            fi
          fi
          
          java -Xms6G -jar fabric-server-launch.jar nogui
        # Maximum workflow duration is 360 minutes.
        # Setting this prevents progress from being lost by forgetting to stop the server.
        timeout-minutes: 320
        continue-on-error: true
      - name: Save to GitHub
        run: |
          git pull
          git config user.name github-actions
          git config user.email actions@github.com
          git add .
          git commit -m "$(cat commit-message.txt)"
          git push
